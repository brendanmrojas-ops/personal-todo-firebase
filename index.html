<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To&#8209;Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF9F6; --panel: #FFFFFF; --ink: #16140F; --charcoal: #57544C; --muted: #8A8578;
    --line: #E9E4D8; --gold: #B8934B; --gold-light: #D9BE85; --gold-deep: #8C6D33; --gold-wash: #F6EFDD;
    --err: #8C4A3A;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body{ min-height:100vh; display:flex; justify-content:center; padding: 56px 20px 80px; }
  .app{ width:100%; max-width: 600px; }
  header{ text-align:center; margin-bottom: 30px; }
  .eyebrow{ font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold-deep); font-weight:600; margin-bottom: 10px; }
  h1{ font-family: 'Cormorant Garamond', serif; font-weight:600; font-size: 42px; letter-spacing: 0.02em; margin: 0 0 14px; color: var(--ink); }
  .rule{ width: 64px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto; }

  .auth-screen{ display:flex; justify-content:center; }
  .auth-card{ background:var(--panel); border:1px solid var(--line); border-top:2px solid var(--gold); padding:32px 28px; width:100%; max-width:360px; }
  .auth-card .eyebrow{ text-align:center; }
  .auth-card input{
    display:block; width:100%; border:1px solid var(--line); background:var(--bg);
    padding:12px 14px; font-size:14px; font-family:'Inter',sans-serif; margin-bottom:12px;
    outline:none; transition:border-color .15s ease;
  }
  .auth-card input:focus{ border-color:var(--gold); }
  .auth-submit{
    width:100%; border:none; background:var(--ink); color:var(--gold-light); padding:12px;
    font-size:13.5px; letter-spacing:0.03em; cursor:pointer; font-family:'Inter',sans-serif;
    font-weight:600; transition:background .15s ease;
  }
  .auth-submit:hover{ background:var(--gold-deep); color:#fff; }
  .auth-toggle-link{ display:block; width:100%; text-align:center; background:none; border:none; margin-top:14px; padding:6px; font-size:12px; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif; }
  .auth-toggle-link:hover{ color:var(--gold-deep); }
  .auth-error{ font-size:12.5px; color:var(--err); margin-bottom:10px; }
  .auth-error:empty{ display:none; }
  .auth-hint{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:2px; }

  .account-bar{ display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:14px; font-size:11.5px; color:var(--muted); }
  .account-bar button{ background:none; border:none; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif; font-size:11.5px; text-decoration:underline; text-underline-offset:2px; }
  .account-bar button:hover{ color:var(--gold-deep); }

  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 22px; }
  .tab{
    display:flex; align-items:center;
    padding: 7px 13px; border: 1px solid var(--line); background: var(--panel);
    font-size: 12px; font-family: 'Inter', sans-serif; letter-spacing: 0.01em;
    color: var(--charcoal); cursor: pointer; white-space: nowrap;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .tab .count{ color: var(--muted); margin-left: 5px; font-size: 11px; }
  .tab.active{ border-color: var(--gold); background: var(--gold-wash); color: var(--ink); font-weight: 600; }
  .tab.active .count{ color: var(--gold-deep); }
  .tab:hover:not(.active){ border-color: var(--gold-light); }
  .tab-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; flex-shrink:0; }
  .tab-dot.all{ background: conic-gradient(#5C6B82 0deg 72deg, #8B3A4A 72deg 144deg, #3E6B57 144deg 216deg, #A6653A 216deg 288deg, #6B4A78 288deg 360deg); }

  .panel{ background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--gold); padding: 26px 26px 20px; }

  .add-row{ display:flex; flex-wrap: wrap; gap:8px; align-items:center; margin-bottom: 26px; }
  .add-row input[type="text"]{
    flex: 1 1 200px; min-width: 140px; border: 1px solid var(--line); background: var(--bg);
    padding: 12px 14px; font-size: 14.5px; font-family: 'Inter', sans-serif; color: var(--ink);
    outline: none; transition: border-color .15s ease;
  }
  .add-row input[type="text"]::placeholder{ color: var(--muted); }
  .add-row input[type="text"]:focus{ border-color: var(--gold); }
  .add-row select, .add-row input[type="date"]{
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg);
    padding: 11px 10px; font-size: 12.5px; font-family: 'Inter', sans-serif; color: var(--charcoal);
    outline: none; accent-color: var(--gold-deep); transition: border-color .15s ease;
  }
  .add-row select{ width: 168px; cursor:pointer; }
  .add-row input[type="date"]{ width: 124px; }
  .add-row select:focus, .add-row input[type="date"]:focus{ border-color: var(--gold); }

  .add-btn, .urgent-toggle{ flex: 0 0 auto; width: 40px; height: 40px; cursor: pointer; display:flex; align-items:center; justify-content:center; transition: all .15s ease; }
  .add-btn{ border:none; background: var(--ink); color: var(--gold-light); }
  .add-btn:hover{ background: var(--gold-deep); color: #fff; }
  .add-btn svg{ width: 16px; height:16px; }
  .urgent-toggle{ border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .urgent-toggle svg{ width: 16px; height:16px; }
  .urgent-toggle:hover{ border-color: var(--gold-light); }
  .urgent-toggle.active{ border-color: var(--gold); background: var(--gold-wash); color: var(--gold-deep); }

  .section-label{ font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 12px; display:flex; justify-content:space-between; align-items:center; }

  ul.tasks{ list-style:none; margin:0; padding:0; }
  li.task{
    display:flex; align-items:flex-start; gap: 10px; padding: 13px 2px; border-bottom: 1px solid var(--line);
    transition: opacity .35s ease, max-height .35s ease, padding .35s ease, transform .35s ease, background .2s ease;
    max-height: 90px; overflow:hidden;
  }
  li.task.urgent{ background: linear-gradient(90deg, var(--gold-wash), rgba(246,239,221,0) 60%); }
  li.task.removing{ opacity: 0; max-height: 0; padding-top:0; padding-bottom:0; transform: translateX(6px); border-color: transparent; }
  li.task:last-child{ border-bottom: none; }

  .check{
    flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--charcoal);
    margin-top: 2px; cursor: pointer; display:flex; align-items:center; justify-content:center;
    background: transparent; transition: border-color .15s ease, background .15s ease; position: relative;
  }
  .check:hover{ border-color: var(--gold-deep); }
  .check.overdue-ring{ border-color: var(--gold); }
  .check svg{ width: 11px; height: 11px; opacity: 0; transition: opacity .15s ease; }
  li.completed .check{ background: var(--gold); border-color: var(--gold); }
  li.completed .check svg{ opacity: 1; }

  .star-btn{ flex: 0 0 auto; background:none; border:none; cursor:pointer; padding: 3px; margin-top: 1px; color: var(--line); transition: color .15s ease; }
  .star-btn svg{ width: 15px; height:15px; }
  .star-btn:hover{ color: var(--gold-light); }
  .star-btn.active{ color: var(--gold); }

  .task-body{ flex: 1 1 auto; min-width:0; }
  .task-text{ font-size: 14.5px; color: var(--ink); line-height: 1.4; word-break: break-word; }
  li.completed .task-text{ color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .task-meta{ margin-top: 4px; font-size: 11.5px; letter-spacing: 0.02em; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .cat-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .cat-tag{ color: var(--charcoal); text-transform: uppercase; font-size: 10px; letter-spacing: 0.07em; font-weight: 600; }
  .meta-sep{ color: var(--line); }
  .due-pill{ color: var(--charcoal); }
  .due-pill.overdue{ color: var(--gold-deep); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .done-date{ color: var(--muted); }

  .del-btn{ flex: 0 0 auto; background: none; border: none; cursor: pointer; color: var(--line); padding: 4px; margin-top: -2px; transition: color .15s ease; }
  li.task:hover .del-btn{ color: var(--muted); }
  .del-btn:hover{ color: var(--gold-deep) !important; }
  .del-btn svg{ width: 14px; height:14px; }

  .empty{ font-size: 13.5px; color: var(--muted); font-style: italic; padding: 18px 2px 22px; }

  .completed-toggle{
    width:100%; background:none; border:none; border-top: 1px solid var(--line);
    padding: 16px 2px 8px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-family: 'Inter', sans-serif;
  }
  .completed-toggle .label{ font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight:600; }
  .completed-toggle .chev{ width: 9px; height:9px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .2s ease; margin-right: 2px; }
  .completed-toggle.open .chev{ transform: rotate(45deg); }

  .completed-wrap{ max-height: 0; overflow:hidden; transition: max-height .3s ease; }
  .completed-wrap.open{ max-height: 1600px; }
  .completed-inner{ padding-top: 6px; }

  .clear-row{ display:flex; justify-content:flex-end; padding: 10px 2px 4px; }
  .clear-link{ background:none; border:none; font-family:'Inter', sans-serif; font-size: 11.5px; color: var(--muted); cursor:pointer; letter-spacing:0.03em; }
  .clear-link:hover{ color: var(--gold-deep); }
  .clear-link.confirm{ color: var(--gold-deep); font-weight:600; }

  .status{ text-align:center; color: var(--muted); font-size: 13px; padding: 40px 0; }

  @media (max-width: 480px){
    h1{ font-size: 34px; }
    .panel{ padding: 20px 16px 16px; }
    .add-row select{ width: 100%; }
    .add-row input[type="date"]{ width: 100%; }
    .add-row input[type="text"]{ flex-basis: 100%; }
    li.task{ gap: 7px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="eyebrow">Personal</div>
      <h1>To&#8209;Do</h1>
      <div class="rule"></div>
    </header>

    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="eyebrow" id="authTitle">Sign In</div>
        <div class="auth-error" id="authError"></div>
        <input type="email" id="authEmail" placeholder="Email" autocomplete="username">
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
        <button class="auth-submit" id="authSubmit">Sign In</button>
        <button class="auth-toggle-link" id="authToggleMode">Need an account? Create one</button>
        <div class="auth-hint">This is just for you &mdash; your list is private to this login.</div>
      </div>
    </div>

    <div id="appRoot" style="display:none;">
      <div class="account-bar">
        <span id="accountEmail"></span>
        <button id="signOutBtn">Sign out</button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="panel" id="panel">
        <div class="status" id="status">Loading your list&hellip;</div>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut
  } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

  // =========================================================
  // TODO: Replace with YOUR OWN Firebase project config.
  // Get this from: Project settings > Your apps > the </> web icon.
  // =========================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCUPmGc0LRr2hP6md03ROdyLbOPjj1MJnM",
    authDomain: "brendan-to-do.firebaseapp.com",
    projectId: "brendan-to-do",
    storageBucket: "brendan-to-do.firebasestorage.app",
    messagingSenderId: "805864716025",
    appId: "1:805864716025:web:5e331005f64bef4d0c1428"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  const CATEGORIES = ['Personal', 'First Class Creators', 'IT Learning', 'Real Estate', 'Brendan Rojas Brand'];
  const CATEGORY_COLORS = {
    'Personal': '#5C6B82',
    'First Class Creators': '#8B3A4A',
    'IT Learning': '#3E6B57',
    'Real Estate': '#A6653A',
    'Brendan Rojas Brand': '#6B4A78'
  };

  let tasks = [];
  let currentTab = 'All';
  let completedOpen = false;
  let clearArmed = false;
  let newTaskUrgent = false;
  let unsubscribeSnapshot = null;
  let authMode = 'signin';

  const panel = document.getElementById('panel');
  const tabsEl = document.getElementById('tabs');
  const authScreen = document.getElementById('authScreen');
  const appRoot = document.getElementById('appRoot');

  // ---------- Auth ----------
  function friendlyAuthError(e){
    const code = (e && e.code) || '';
    if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
    if(code.includes('user-not-found')) return "No account with that email. Try 'Create one' instead.";
    if(code.includes('email-already-in-use')) return 'An account already exists for that email. Try signing in instead.';
    if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
    if(code.includes('invalid-email')) return 'That email address looks off.';
    return 'Something went wrong. Please try again.';
  }

  function setAuthMode(mode){
    authMode = mode;
    document.getElementById('authTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
    document.getElementById('authSubmit').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
    document.getElementById('authToggleMode').textContent = mode === 'signin' ? 'Need an account? Create one' : 'Already have an account? Sign in';
    document.getElementById('authError').textContent = '';
  }

  document.getElementById('authToggleMode').addEventListener('click', () => {
    setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
  });

  document.getElementById('authSubmit').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';
    if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }
    try{
      if(authMode === 'signin'){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
    } catch(e){
      errEl.textContent = friendlyAuthError(e);
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', () => { signOut(auth); });

  onAuthStateChanged(auth, user => {
    if(user){
      authScreen.style.display = 'none';
      appRoot.style.display = '';
      document.getElementById('accountEmail').textContent = user.email || '';
      subscribeToTasks(user.uid);
    } else {
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      tasks = [];
      appRoot.style.display = 'none';
      authScreen.style.display = '';
    }
  });

  // ---------- Data ----------
  function subscribeToTasks(uid){
    const ref = doc(db, 'todos', uid);
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = onSnapshot(ref, snap => {
      if(snap.exists() && snap.data() && snap.data().data){
        try{ tasks = JSON.parse(snap.data().data); } catch(e){ tasks = []; }
      } else {
        tasks = [];
      }
      tasks.forEach(t => {
        if(!t.category || CATEGORIES.indexOf(t.category) === -1) t.category = 'Personal';
        if(typeof t.urgent !== 'boolean') t.urgent = false;
      });
      render();
    }, err => {
      console.error('Sync error', err);
      panel.innerHTML = '<div class="status">Could not connect. Check your internet connection.</div>';
    });
  }

  async function persist(){
    if(!auth.currentUser) return;
    try{
      await setDoc(doc(db, 'todos', auth.currentUser.uid), { data: JSON.stringify(tasks) });
    } catch(e){
      console.error('Could not save tasks', e);
    }
  }

  function todayStr(){
    const d = new Date();
    const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,10);
  }

  function fmtDate(dateStr){
    if(!dateStr) return '';
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const now = new Date();
    const opts = dt.getFullYear() === now.getFullYear()
      ? { month:'short', day:'numeric' }
      : { month:'short', day:'numeric', year:'numeric' };
    return dt.toLocaleDateString('en-US', opts);
  }

  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function iconCheck(){
    return '<svg viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5L4.2 8.2L11 1" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function iconPlus(){
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2V14M2 8H14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  }
  function iconTrash(){
    return '<svg viewBox="0 0 14 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 4H12.5M5 4V2.3C5 1.9 5.3 1.5 5.8 1.5H8.2C8.6 1.5 9 1.9 9 2.3V4M11 4L10.5 13.5C10.5 14 10.1 14.5 9.5 14.5H4.5C4 14.5 3.6 14 3.5 13.5L3 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function iconStar(filled){
    if(filled) return '<svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.3l2.1 4.6 5 .5-3.7 3.5 1 5-4.4-2.4-4.4 2.4 1-5-3.7-3.5 5-.5L8 1.3z"/></svg>';
    return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.3l2.1 4.6 5 .5-3.7 3.5 1 5-4.4-2.4-4.4 2.4 1-5-3.7-3.5 5-.5L8 1.3z" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTabs(){
    let html = '';
    const allActiveCount = tasks.filter(t => !t.completedAt).length;
    html += '<button class="tab'+(currentTab==='All'?' active':'')+'" data-tab="All"><span class="tab-dot all"></span>All<span class="count">'+allActiveCount+'</span></button>';
    CATEGORIES.forEach(cat => {
      const n = tasks.filter(t => !t.completedAt && t.category === cat).length;
      html += '<button class="tab'+(currentTab===cat?' active':'')+'" data-tab="'+escapeHtml(cat)+'"><span class="tab-dot" style="background:'+CATEGORY_COLORS[cat]+'"></span>'+escapeHtml(cat)+'<span class="count">'+n+'</span></button>';
    });
    tabsEl.innerHTML = html;
    tabsEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.getAttribute('data-tab');
        completedOpen = false;
        clearArmed = false;
        render();
      });
    });
  }

  function render(){
    renderTabs();

    const inScope = t => currentTab === 'All' || t.category === currentTab;
    const active = tasks.filter(t => !t.completedAt && inScope(t)).sort((a,b)=>{
      if(a.urgent !== b.urgent) return a.urgent ? -1 : 1;
      if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
      if(a.dueDate) return -1;
      if(b.dueDate) return 1;
      return a.createdAt - b.createdAt;
    });
    const completed = tasks.filter(t => t.completedAt && inScope(t)).sort((a,b)=> b.completedAt - a.completedAt);
    const today = todayStr();
    const defaultCat = currentTab === 'All' ? CATEGORIES[0] : currentTab;

    let html = '';

    html += '<div class="add-row">';
    html += '<input type="text" id="taskInput" placeholder="Add a task&hellip;" maxlength="200">';
    html += '<select id="categorySelect">';
    CATEGORIES.forEach(cat => {
      html += '<option value="'+escapeHtml(cat)+'"'+(cat===defaultCat?' selected':'')+'>'+escapeHtml(cat)+'</option>';
    });
    html += '</select>';
    html += '<input type="date" id="dateInput">';
    html += '<button type="button" class="urgent-toggle'+(newTaskUrgent?' active':'')+'" id="urgentToggle" aria-pressed="'+(newTaskUrgent?'true':'false')+'" aria-label="Mark new task as urgent">'+iconStar(newTaskUrgent)+'</button>';
    html += '<button class="add-btn" id="addBtn" aria-label="Add task">' + iconPlus() + '</button>';
    html += '</div>';

    html += '<div class="section-label"><span>Tasks</span><span>' + active.length + '</span></div>';

    if(active.length === 0){
      html += '<div class="empty">Nothing '+(currentTab==='All' ? 'on your plate' : 'in '+escapeHtml(currentTab))+' right now. Add your first task above.</div>';
    } else {
      html += '<ul class="tasks">';
      active.forEach(t => {
        const overdue = t.dueDate && t.dueDate < today;
        html += '<li class="task'+(t.urgent?' urgent':'')+'" data-id="'+t.id+'">';
        html += '<button class="check'+(overdue?' overdue-ring':'')+'" data-action="toggle" data-id="'+t.id+'" aria-label="Mark complete"></button>';
        html += '<button class="star-btn'+(t.urgent?' active':'')+'" data-action="urgent" data-id="'+t.id+'" aria-pressed="'+(t.urgent?'true':'false')+'" aria-label="'+(t.urgent?'Unmark urgent':'Mark urgent')+'">'+iconStar(t.urgent)+'</button>';
        html += '<div class="task-body">';
        html += '<div class="task-text">'+escapeHtml(t.text)+'</div>';
        const metaParts = [];
        if(currentTab === 'All') metaParts.push('<span class="cat-dot" style="background:'+CATEGORY_COLORS[t.category]+'"></span><span class="cat-tag">'+escapeHtml(t.category)+'</span>');
        if(t.dueDate) metaParts.push('<span class="due-pill'+(overdue?' overdue':'')+'">'+(overdue ? 'Overdue &middot; ' + fmtDate(t.dueDate) : 'Due ' + fmtDate(t.dueDate))+'</span>');
        if(metaParts.length){
          html += '<div class="task-meta">'+metaParts.join('<span class="meta-sep">&middot;</span>')+'</div>';
        }
        html += '</div>';
        html += '<button class="del-btn" data-action="delete" data-id="'+t.id+'" aria-label="Delete task">'+iconTrash()+'</button>';
        html += '</li>';
      });
      html += '</ul>';
    }

    html += '<button class="completed-toggle'+(completedOpen?' open':'')+'" id="completedToggle">';
    html += '<span class="label">Completed &middot; '+completed.length+'</span>';
    html += '<span class="chev"></span>';
    html += '</button>';

    html += '<div class="completed-wrap'+(completedOpen?' open':'')+'" id="completedWrap"><div class="completed-inner">';
    if(completed.length === 0){
      html += '<div class="empty">Completed tasks will collect here.</div>';
    } else {
      html += '<ul class="tasks">';
      completed.forEach(t => {
        html += '<li class="task completed" data-id="'+t.id+'">';
        html += '<button class="check" data-action="toggle" data-id="'+t.id+'" aria-label="Mark incomplete">'+iconCheck()+'</button>';
        html += '<div class="task-body">';
        html += '<div class="task-text">'+escapeHtml(t.text)+'</div>';
        const metaParts = [];
        if(currentTab === 'All') metaParts.push('<span class="cat-dot" style="background:'+CATEGORY_COLORS[t.category]+'"></span><span class="cat-tag">'+escapeHtml(t.category)+'</span>');
        metaParts.push('<span class="done-date">Completed '+fmtDate(new Date(t.completedAt).toISOString().slice(0,10))+'</span>');
        html += '<div class="task-meta">'+metaParts.join('<span class="meta-sep">&middot;</span>')+'</div>';
        html += '</div>';
        html += '<button class="del-btn" data-action="delete" data-id="'+t.id+'" aria-label="Delete task">'+iconTrash()+'</button>';
        html += '</li>';
      });
      html += '</ul>';
      html += '<div class="clear-row"><button class="clear-link'+(clearArmed?' confirm':'')+'" id="clearBtn">'+(clearArmed ? 'Click again to clear' : 'Clear completed')+'</button></div>';
    }
    html += '</div></div>';

    panel.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers(){
    const input = document.getElementById('taskInput');
    const catSelect = document.getElementById('categorySelect');
    const dateInput = document.getElementById('dateInput');
    const addBtn = document.getElementById('addBtn');
    const urgentToggle = document.getElementById('urgentToggle');

    function doAdd(){
      const text = input.value.trim();
      if(!text) { input.focus(); return; }
      tasks.push({
        id: uid(), text: text, category: catSelect.value, dueDate: dateInput.value || null,
        urgent: newTaskUrgent, createdAt: Date.now(), completedAt: null
      });
      newTaskUrgent = false;
      persist();
      render();
    }

    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });

    if(urgentToggle){
      urgentToggle.addEventListener('click', () => {
        newTaskUrgent = !newTaskUrgent;
        urgentToggle.classList.toggle('active', newTaskUrgent);
        urgentToggle.setAttribute('aria-pressed', String(newTaskUrgent));
        urgentToggle.innerHTML = iconStar(newTaskUrgent);
      });
    }

    panel.querySelectorAll('[data-action="toggle"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const li = btn.closest('li.task');
        const task = tasks.find(t => t.id === id);
        if(!task) return;
        if(li) li.classList.add('removing');
        setTimeout(() => {
          task.completedAt = task.completedAt ? null : Date.now();
          persist();
          render();
        }, li ? 320 : 0);
      });
    });

    panel.querySelectorAll('[data-action="urgent"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const task = tasks.find(t => t.id === id);
        if(!task) return;
        task.urgent = !task.urgent;
        persist();
        render();
      });
    });

    panel.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const li = btn.closest('li.task');
        if(li) li.classList.add('removing');
        setTimeout(() => {
          tasks = tasks.filter(t => t.id !== id);
          persist();
          render();
        }, li ? 320 : 0);
      });
    });

    const toggleBtn = document.getElementById('completedToggle');
    if(toggleBtn){
      toggleBtn.addEventListener('click', () => {
        completedOpen = !completedOpen;
        clearArmed = false;
        render();
      });
    }

    const clearBtn = document.getElementById('clearBtn');
    if(clearBtn){
      clearBtn.addEventListener('click', () => {
        const inScope = t => currentTab === 'All' || t.category === currentTab;
        if(clearArmed){
          tasks = tasks.filter(t => !(t.completedAt && inScope(t)));
          clearArmed = false;
          persist();
          render();
        } else {
          clearArmed = true;
          render();
        }
      });
    }
  }
</script>
</body>
</html>
